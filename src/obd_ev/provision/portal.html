<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WiFi setup</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#fff; --ink:#15181d; --muted:#5c6470; --line:#dfe3e8;
    --accent:#1f5fd0; --accent-ink:#fff;
    --err-bg:#fdeced; --err-line:#e9a8ad; --err-ink:#8a1f28;
    --ok-bg:#e8f6ec; --ok-line:#9dd3ae; --ok-ink:#1c5c31;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14161a; --card:#1c1f25; --ink:#eceff3; --muted:#a0a8b4; --line:#2c313a;
      --accent:#5b93f0; --accent-ink:#0b1220;
      --err-bg:#3a1d20; --err-line:#7a3d44; --err-ink:#f3b3b8;
      --ok-bg:#16301f; --ok-line:#356b45; --ok-ink:#a8e0bb;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);padding:24px 16px 48px;
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  main{max-width:460px;margin:0 auto}
  h1{font-size:21px;margin:0 0 18px}
  label{display:block;font-weight:600;margin:0 0 6px}
  select,input[type=text],input[type=password]{width:100%;padding:12px;
    font-size:16px;border:1px solid var(--line);border-radius:8px;
    background:var(--card);color:var(--ink)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:16px}
  .field{margin-top:16px}
  .row{display:flex;gap:8px;align-items:center;margin-top:10px}
  .row input[type=checkbox]{width:20px;height:20px;flex:none}
  .row label{margin:0;font-weight:400}
  button{width:100%;padding:14px;font-size:17px;font-weight:600;
    background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;
    margin-top:18px;cursor:pointer}
  button[disabled]{opacity:.55;cursor:default}
  .note{color:var(--muted);font-size:14px;margin-top:14px}
  .err{background:var(--err-bg);border:1px solid var(--err-line);
    color:var(--err-ink);border-radius:10px;padding:12px;margin-bottom:14px}
  .ok{background:var(--ok-bg);border:1px solid var(--ok-line);color:var(--ok-ink);
    border-radius:10px;padding:14px}
  [hidden]{display:none !important}
</style>
</head>
<body>
<main>
  <h1>WiFi setup</h1>

  <div id="error" class="err" hidden></div>

  <form id="form" class="card">
    <label for="ssid">Network</label>
    <select id="ssid"><option value="">Loading…</option></select>

    <div class="row">
      <input type="checkbox" id="manual">
      <label for="manual">Not listed</label>
    </div>
    <div id="manualWrap" hidden class="field">
      <label for="manualSsid">Network name</label>
      <input type="text" id="manualSsid" autocapitalize="none"
             autocorrect="off" spellcheck="false">
      <div class="row">
        <input type="checkbox" id="hidden">
        <label for="hidden">Hidden network</label>
      </div>
      <div class="row">
        <input type="checkbox" id="manualOpen">
        <label for="manualOpen">No password</label>
      </div>
    </div>

    <div class="field" id="pwWrap">
      <label for="pw">Password</label>
      <input type="password" id="pw" autocapitalize="none" autocorrect="off"
             spellcheck="false" autocomplete="off">
      <div class="row">
        <input type="checkbox" id="show">
        <label for="show">Show</label>
      </div>
    </div>

    <p class="note" id="openNote" hidden>This network has no password.</p>

    <div id="saeWarn" class="err" hidden style="margin:14px 0 0">
      WPA3 network: the password will be sent to the device as typed.
    </div>

    <button type="submit" id="go">Connect</button>

    <p class="note">Your password is not sent to us. It is scrambled on this
    phone first.</p>
  </form>

  <div id="working" class="card" hidden>
    <strong>Connecting to <span id="workingSsid"></span>…</strong>
    <p class="note"><b>__AP_SSID__</b> will disappear. If nothing else happens,
    you are done.</p>
  </div>

  <div id="done" class="ok" hidden></div>

  <noscript>
    <div class="err">JavaScript is required.</div>
  </noscript>
</main>

<script>
/*WPA_JS*/

const $ = (id) => document.getElementById(id);
let networks = [];

function showError(msg){
  const box = $("error");
  box.textContent = msg;
  box.hidden = !msg;
  if (msg) window.scrollTo({top:0, behavior:"smooth"});
}

function chosenNetwork(){
  if ($("manual").checked) {
    // Not trimmed: the name is also the salt the password is scrambled
    // with, so it has to match the router's byte for byte.
    return { ssid: $("manualSsid").value,
             hidden: $("hidden").checked, sae_only:false,
             open: $("manualOpen").checked };
  }
  const ssid = $("ssid").value;
  return networks.find(n => n.ssid === ssid)
      || { ssid, hidden:false, sae_only:false, open:false };
}

function refreshSecurityUI(){
  const net = chosenNetwork();
  $("saeWarn").hidden = !net.sae_only;
  $("pwWrap").hidden = !!net.open;
  $("openNote").hidden = !net.open;
}

function bars(signal){
  if (signal >= 70) return "●●●";
  if (signal >= 45) return "●●○";
  return "●○○";
}

async function loadNetworks(){
  try {
    const resp = await fetch("/api/networks");
    networks = (await resp.json()).networks || [];
  } catch (e) {
    networks = [];
  }
  const sel = $("ssid");
  sel.innerHTML = "";
  if (!networks.length){
    sel.innerHTML = "<option value=''>None found</option>";
    $("manual").checked = true;
    $("manualWrap").hidden = false;
    return;
  }
  sel.appendChild(new Option("Choose…", ""));
  for (const n of networks){
    sel.appendChild(new Option(`${n.ssid}  ${bars(n.signal)}`, n.ssid));
  }
}

$("manual").addEventListener("change", (e) => {
  $("manualWrap").hidden = !e.target.checked;
  $("ssid").disabled = e.target.checked;
  refreshSecurityUI();
});
$("manualOpen").addEventListener("change", refreshSecurityUI);
$("show").addEventListener("change", (e) => {
  $("pw").type = e.target.checked ? "text" : "password";
});
$("ssid").addEventListener("change", refreshSecurityUI);

$("form").addEventListener("submit", (e) => {
  e.preventDefault();
  showError("");
  const net = chosenNetwork();
  const password = $("pw").value;

  if (!net.ssid.trim()) { showError("Choose a network."); return; }
  if (!net.open && password.length < 8) {
    showError("Password must be at least 8 characters.");
    return;
  }

  $("go").disabled = true;
  $("go").textContent = "Working…";

  // Yield a frame so the button text repaints before the derivation blocks.
  setTimeout(async () => {
    let psk = null;
    try {
      if (!net.open && !net.sae_only) psk = wpaPsk(net.ssid, password);
    } catch (err) {
      showError("Could not prepare the password on this phone.");
      $("go").disabled = false; $("go").textContent = "Connect";
      return;
    }
    // WPA3-only networks cannot be joined from a PMK; send the passphrase,
    // which the notice above told the participant about. Open networks
    // send no credential at all.
    const body = { ssid: net.ssid, hidden: !!net.hidden,
                   psk: net.open ? null : (psk || password),
                   key_mgmt: net.sae_only ? "sae" : "wpa-psk" };
    try {
      const resp = await fetch("/api/connect", {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify(body)
      });
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.error || "Rejected");
      $("form").hidden = true;
      $("workingSsid").textContent = net.ssid;
      $("working").hidden = false;
      pollStatus();
    } catch (err) {
      showError(err.message || "Could not reach the device.");
      $("go").disabled = false; $("go").textContent = "Connect";
    }
  }, 50);
});

async function pollStatus(){
  // Usually stops working the moment the access point goes down, which is
  // itself the success signal. It only reports back if we stayed connected.
  for (let i = 0; i < 40; i++){
    await new Promise(r => setTimeout(r, 3000));
    try {
      const s = await (await fetch("/api/status")).json();
      if (s.state === "connected"){
        $("working").hidden = true;
        $("done").hidden = false;
        $("done").textContent = "Connected to " + s.ssid + ". You are done.";
        return;
      }
      if (s.state === "failed"){
        $("working").hidden = true;
        $("form").hidden = false;
        $("go").disabled = false; $("go").textContent = "Connect";
        showError(s.error || "That did not work. Check the password.");
        return;
      }
    } catch (e) { /* AP is down; expected */ }
  }
}

loadNetworks();
</script>
</body>
</html>
